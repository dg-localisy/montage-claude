<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="utf-8">
<title>SOCO · Visuel 01 · L'hiver peut venir</title>
<link rel="stylesheet" href="../assets/css/polices.css">
<link rel="stylesheet" href="../assets/css/soco.css">
<style>
  .photo { background-image: url("../assets/photos/v1_route_automne.jpg"); filter: saturate(1.04) contrast(1.03); }
  .voile-haut { background: linear-gradient(180deg, rgba(7,7,9,.86) 0%, rgba(7,7,9,.55) 22%, rgba(7,7,9,.12) 40%, rgba(7,7,9,0) 48%); }
  .voile-bas  { background: linear-gradient(0deg, rgba(7,7,9,.94) 0%, rgba(7,7,9,.78) 17%, rgba(7,7,9,.3) 33%, rgba(7,7,9,0) 44%); }

  .haut { position: absolute; left: var(--marge); right: var(--marge); top: 168px; }
  .titre { font-size: 128px; margin-top: 24px; }
  .sous-titre { margin-top: 28px; color: rgba(255,255,255,.9); }

  .bas { position: absolute; left: var(--marge); right: var(--marge); bottom: var(--marge-bas); }
  .preuves { padding-bottom: 34px; border-bottom: 1.5px solid rgba(255,255,255,.2); }
  .action { display: flex; align-items: center; justify-content: space-between; margin-top: 34px; }
  .mention { margin-top: 22px; }
</style>
</head>
<body>
<div class="visuel">
  <div class="photo"></div>
  <div class="voile voile-haut"></div>
  <div class="voile voile-bas"></div>
  <div class="grain"></div>

  <div class="logo-attente">LOGO SOCO</div>

  <div class="haut">
    <div class="surtitre">Novembre</div>
    <h1 class="titre">L’hiver<br>peut venir.</h1>
    <p class="sous-titre">Partez serein au volant d’une occasion<br>contrôlée et garantie.</p>
  </div>

  <div class="bas">
    <div class="preuves">
      <div class="preuve">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16.5" rx="2.2"/><path d="M9 4.5V3.2h6v1.3"/><path d="M8.6 11.2l1.6 1.6 3.2-3.2"/><path d="M8.6 16.4l1.6 1.6 3.2-3.2"/></svg>
        <span>Plus de 100&nbsp;contrôles</span>
      </div>
      <div class="preuve">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l7.5 3v5.6c0 4.6-3.1 8.4-7.5 9.9-4.4-1.5-7.5-5.3-7.5-9.9V5.8l7.5-3z"/><path d="M8.6 12.1l2.4 2.4 4.5-4.6"/></svg>
        <span>Garantie jusqu’à 7&nbsp;ans*</span>
      </div>
    </div>
    <div class="action">
      <span class="cta">Trouver ma voiture
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
      <span class="url">soco.be</span>
    </div>
    <p class="mention">*Extension de garantie selon conditions, hors véhicules utilitaires.</p>
  </div>
</div>
</body>
</html>
